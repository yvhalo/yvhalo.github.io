<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Yvette Hernández Alonso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0c1a;
      --surface: #16132a;
      --text:    #ddd8f0;
      --dim:     #6b6485;
      --border:  rgba(180, 160, 230, 0.2);

      --purple: #c4a8ff;
      --blue:   #8ecfff;
      --pink:   #ffb0d0;
      --yellow: #ffe5a0;
      --mint:   #a0f0c8;
      --peach:  #ffcba8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem 4rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ── Header ── */
    header {
      width: 100%;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .header-inner {
      max-width: 720px;
      width: 100%;
      padding: 0.5rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--dim);
      font-size: 0.82rem;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 0.5rem 0 0;
      transition: color 0.1s;
    }

    .back .prompt { color: var(--purple); }
    .back .cmd    { color: var(--blue); }
    .back:hover .cmd { text-shadow: 0 0 8px rgba(142,207,255,0.6); }

    .header-identity {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.1rem;
      text-decoration: none;
      color: inherit;
      min-width: 0;
      min-height: 44px;
      justify-content: center;
      padding: 0 0 0 0.5rem;
    }

    .header-name {
      font-size: 0.82rem;
      font-weight: bold;
      color: var(--pink);
      transition: text-shadow 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-identity:hover .header-name {
      text-shadow: 0 0 8px rgba(255,176,208,0.5);
    }

    .header-role {
      font-size: 0.7rem;
      color: var(--dim);
      white-space: nowrap;
    }

    /* ── Content ── */
    .page { max-width: 720px; width: 100%; }

    .cmd-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }

    .prompt { color: var(--purple); user-select: none; }
    .cmd    { color: var(--blue); }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .file-entry {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      min-height: 64px;
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      transition: background 0.1s, border-color 0.1s;
    }

    .file-entry:hover {
      background: rgba(196,168,255,0.05);
      border-color: var(--purple);
    }

    .file-icon { font-size: 1.1rem; user-select: none; }

    .file-info { display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
    .file-name { color: var(--yellow); font-weight: bold; }
    .file-desc { color: var(--dim); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .file-badge {
      font-size: 0.7rem;
      color: var(--peach);
      border: 1px solid rgba(255,203,168,0.35);
      padding: 0.15rem 0.45rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { display: inline-block; color: var(--purple); animation: blink 1s step-end infinite; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back" href="../index.html">
        <span class="prompt">$</span> <span class="cmd">cd ~</span>
      </a>
      <a class="header-identity" href="../index.html">
        <span class="header-name">Yvette Hernández Alonso</span>
        <span class="header-role">Android Developer</span>
      </a>
    </div>
  </header>

  <div class="page">
    <div class="cmd-line">
      <span class="prompt">$</span>
      <span class="cmd">ls ./projects/</span>
    </div>

    <div class="file-list">
      <a class="file-entry" href="cardsgame/index.html">
        <span class="file-icon">🃏</span>
        <div class="file-info">
          <span class="file-name">cardsgame/</span>
          <span class="file-desc">A web card game in the idea phase</span>
        </div>
        <span class="file-badge">[idea]</span>
      </a>
    </div>
  </div>
</body>
</html>
