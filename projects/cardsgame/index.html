<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cards Game — Yvette Hernández Alonso</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../styles/project-page.css" />
  <link rel="stylesheet" href="../../styles/cardsgame.css" />
</head>
<body>
  <div class="phone-screen">

    <div class="phone-status">
      <span class="s-signal"><span class="sig-bar">▂</span><span class="sig-bar">▄</span><span class="sig-bar">▆</span> GPRS</span>
      <span id="clock"></span>
      <span class="s-battery" id="battery">···</span>
    </div>

    <div class="phone-title-bar">
      <a href="../index.html">&#9664; back</a>
      <span class="phone-title-label">CARDS GAME</span>
      <span></span>
    </div>

    <div class="screen-body">
      <div class="suits">
        <span class="s-purple">&#9824;</span>
        <span class="s-pink">&#9829;</span>
        <span class="s-blue">&#9830;</span>
        <span class="s-mint">&#9827;</span>
      </div>

      <p class="game-title">Cards Game</p>

      <div class="game-row">
        <span class="game-label">STATUS:</span>
        <span class="game-value">COMING SOON</span>
      </div>

      <p class="game-desc">Something fun is being shuffled together.<br>Check back soon!</p>
    </div>


  </div>
  <script>
    const c = document.getElementById('clock');
    const tick = () => { const n = new Date(); c.textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); };
    tick(); setInterval(tick, 1000);
    const bat = document.getElementById('battery');
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        const upd = () => { bat.textContent = (b.charging ? '⚡' : '') + Math.round(b.level * 100) + '%'; };
        upd(); b.onlevelchange = upd; b.onchargingchange = upd;
      });
    } else { bat.textContent = ''; }
  </script>
</body>
</html>
