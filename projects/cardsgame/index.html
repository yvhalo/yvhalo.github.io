<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cards Game — Yvette Hernández Alonso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0c1a;
      --surface: #16132a;
      --text:    #ddd8f0;
      --dim:     #6b6485;
      --border:  rgba(180, 160, 230, 0.2);

      --purple: #c4a8ff;
      --blue:   #8ecfff;
      --pink:   #ffb0d0;
      --yellow: #ffe5a0;
      --mint:   #a0f0c8;
      --peach:  #ffcba8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem 4rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* ── Header ── */
    header {
      width: 100%;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .header-inner {
      max-width: 720px;
      width: 100%;
      padding: 0.5rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--dim);
      font-size: 0.82rem;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 0.5rem 0 0;
      transition: color 0.1s;
    }

    .back .prompt { color: var(--purple); }
    .back .cmd    { color: var(--blue); }
    .back:hover .cmd { text-shadow: 0 0 8px rgba(142,207,255,0.6); }

    .header-identity {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.1rem;
      text-decoration: none;
      color: inherit;
      min-width: 0;
      min-height: 44px;
      justify-content: center;
      padding: 0 0 0 0.5rem;
    }

    .header-name {
      font-size: 0.82rem;
      font-weight: bold;
      color: var(--pink);
      transition: text-shadow 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-identity:hover .header-name {
      text-shadow: 0 0 8px rgba(255,176,208,0.5);
    }

    .header-role {
      font-size: 0.7rem;
      color: var(--dim);
      white-space: nowrap;
    }

    /* ── Content ── */
    .page {
      max-width: 720px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .cmd-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.5rem;
    }

    .prompt { color: var(--purple); user-select: none; }
    .cmd    { color: var(--blue); }

    .output {
      padding-left: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .suits {
      display: flex;
      gap: 0.75rem;
      font-size: 1.8rem;
      user-select: none;
    }

    .s-purple { color: var(--purple); text-shadow: 0 0 10px rgba(196,168,255,0.5); }
    .s-pink   { color: var(--pink);   text-shadow: 0 0 10px rgba(255,176,208,0.5); }
    .s-blue   { color: var(--blue);   text-shadow: 0 0 10px rgba(142,207,255,0.5); }
    .s-mint   { color: var(--mint);   text-shadow: 0 0 10px rgba(160,240,200,0.5); }

    .game-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--yellow);
      text-shadow: 0 0 12px rgba(255,229,160,0.4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.82rem;
    }

    .status-key { color: var(--dim); }
    .status-val { color: var(--mint); }

    .game-desc {
      color: var(--dim);
      font-size: 0.85rem;
      line-height: 1.7;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor { display: inline-block; color: var(--purple); animation: blink 1s step-end infinite; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="back" href="../index.html">
        <span class="prompt">$</span> <span class="cmd">cd ..</span>
      </a>
      <a class="header-identity" href="../../index.html">
        <span class="header-name">Yvette Hernández Alonso</span>
        <span class="header-role">Android Developer</span>
      </a>
    </div>
  </header>

  <div class="page">
    <div class="cmd-line">
      <span class="prompt">$</span>
      <span class="cmd">cat cardsgame/README.md</span>
    </div>

    <div class="output">
      <div class="suits">
        <span class="s-purple">♠</span>
        <span class="s-pink">♥</span>
        <span class="s-blue">♦</span>
        <span class="s-mint">♣</span>
      </div>

      <p class="game-title">Cards Game</p>

      <div class="status-line">
        <span class="status-key">STATUS:</span>
        <span class="status-val">COMING SOON</span>
      </div>

      <p class="game-desc">Something fun is being shuffled together.<br>Check back soon!</p>
    </div>

    <div class="cmd-line" style="margin-top: 1.5rem;">
      <span class="prompt">$</span>
      <span class="cursor">█</span>
    </div>
  </div>
</body>
</html>
