<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Side Projects — Yvette Hernández Alonso</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #3ddc84;
      --accent-dim: rgba(61, 220, 132, 0.12);
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4rem 2rem 5rem;
    }

    .page {
      max-width: 720px;
      width: 100%;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
      text-decoration: none;
      margin-bottom: 2.5rem;
      transition: color 0.15s;
    }

    .back:hover {
      color: var(--accent);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .section-header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .section-header .line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .coming-soon {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 4rem 2rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .coming-soon .icon {
      font-size: 2.25rem;
      user-select: none;
    }

    .coming-soon h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .coming-soon p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      max-width: 320px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="back" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Back
    </a>

    <div class="section-header">
      <h1>Side Projects</h1>
      <div class="line"></div>
    </div>

    <div class="coming-soon">
      <span class="icon">🚧</span>
      <h2>Coming soon</h2>
      <p>Projects are on their way. Check back later!</p>
    </div>
  </div>
</body>
</html>
