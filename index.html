<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yvette Hernández Alonso</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/home.css" />
</head>
<body>
  <div class="phone-screen">

    <div class="phone-status">
      <span class="s-signal"><span class="sig-bar">▂</span><span class="sig-bar">▄</span><span class="sig-bar">▆</span> GPRS</span>
      <span id="clock"></span>
      <span class="s-battery" id="battery">···</span>
    </div>

    <div class="contact">
      <p class="contact-name">Yvette Hernández Alonso</p>
      <p class="contact-role">Android Developer</p>
    </div>

    <nav class="menu">
      <a class="menu-item" href="https://linkedin.com/in/yvhalo" target="_blank" rel="noopener noreferrer">
        <!-- person / LinkedIn -->
        <svg class="item-icon" viewBox="0 0 8 8" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="2" y="0" width="4" height="3"/>
          <rect x="1" y="4" width="6" height="1"/>
          <rect x="0" y="5" width="8" height="3"/>
        </svg>
        <span class="item-label">LinkedIn</span>
        <span class="item-arrow">&#9658;</span>
      </a>
      <a class="menu-item" href="https://github.com/yvhalo" target="_blank" rel="noopener noreferrer">
        <!-- terminal >_ / GitHub -->
        <svg class="item-icon" viewBox="0 0 8 8" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="0" y="0" width="8" height="1"/>
          <rect x="0" y="0" width="1" height="8"/>
          <rect x="7" y="0" width="1" height="8"/>
          <rect x="0" y="7" width="8" height="1"/>
          <rect x="2" y="2" width="1" height="1"/>
          <rect x="3" y="3" width="1" height="1"/>
          <rect x="2" y="4" width="1" height="1"/>
          <rect x="4" y="5" width="2" height="1"/>
        </svg>
        <span class="item-label">GitHub</span>
        <span class="item-arrow">&#9658;</span>
      </a>
      <a class="menu-item" href="projects/index.html">
        <!-- folder / Projects -->
        <svg class="item-icon" viewBox="0 0 8 8" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="0" y="1" width="3" height="1"/>
          <rect x="0" y="2" width="8" height="1"/>
          <rect x="0" y="2" width="1" height="6"/>
          <rect x="7" y="2" width="1" height="6"/>
          <rect x="0" y="7" width="8" height="1"/>
        </svg>
        <span class="item-label">Projects</span>
        <span class="item-arrow">&#9658;</span>
      </a>
    </nav>

  </div>
  <script>
    const c = document.getElementById('clock');
    const tick = () => { const n = new Date(); c.textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0'); };
    tick(); setInterval(tick, 1000);
    const bat = document.getElementById('battery');
    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        const upd = () => { bat.textContent = (b.charging ? '⚡' : '') + Math.round(b.level * 100) + '%'; };
        upd(); b.onlevelchange = upd; b.onchargingchange = upd;
      });
    } else { bat.textContent = ''; }
  </script>
</body>
</html>
