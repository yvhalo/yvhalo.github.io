<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yvette Hernández Alonso — Android Developer</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #3ddc84;
      --accent-dim: rgba(61, 220, 132, 0.12);
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Hero card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 3.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
      font-size: 2.5rem;
      user-select: none;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .role {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 1.25rem;
    }

    .role svg {
      flex-shrink: 0;
    }

    .bio {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.65;
      margin-bottom: 2rem;
    }

    .links {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .link-btn.primary {
      background: var(--accent);
      color: #0d1117;
      border: 1px solid var(--accent);
    }

    .link-btn.primary:hover {
      background: #5de69a;
      border-color: #5de69a;
    }

    .link-btn.secondary {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .link-btn.secondary:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">👩‍💻</div>

    <h1>Yvette Hernández Alonso</h1>

    <p class="role">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
        <line x1="12" y1="18" x2="12" y2="18.01"/>
      </svg>
      Android Developer
    </p>

    <p class="bio">
      Building native Android apps with Kotlin. Passionate about clean architecture,
      great user experiences, and the little details that make apps feel right.
    </p>

    <div class="links">
      <a class="link-btn primary" href="https://linkedin.com/in/yvhalo" target="_blank" rel="noopener noreferrer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
          <rect x="2" y="9" width="4" height="12"/>
          <circle cx="4" cy="4" r="2"/>
        </svg>
        LinkedIn
      </a>
      <a class="link-btn secondary" href="https://github.com/yvhalo" target="_blank" rel="noopener noreferrer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">

        </svg>
        GitHub
      </a>
      <a class="link-btn secondary" href="projects.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        Projects
      </a>
    </div>
  </div>

</body>
</html>
