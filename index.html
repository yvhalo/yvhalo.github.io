<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yvette Hernández Alonso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0c1a;
      --surface: #16132a;
      --text:    #ddd8f0;
      --dim:     #6b6485;
      --border:  rgba(180, 160, 230, 0.2);

      --purple: #c4a8ff;
      --blue:   #8ecfff;
      --pink:   #ffb0d0;
      --yellow: #ffe5a0;
      --mint:   #a0f0c8;
      --peach:  #ffcba8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .terminal {
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 0 40px rgba(196,168,255,0.07);
    }

    .t-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.55rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.72rem;
      color: var(--dim);
      user-select: none;
    }

    .t-dots { display: flex; gap: 0.4rem; }
    .t-dot  { width: 10px; height: 10px; border-radius: 50%; }
    .t-dot:nth-child(1) { background: #ff8fa3; }
    .t-dot:nth-child(2) { background: #ffe599; }
    .t-dot:nth-child(3) { background: #a0f0c8; }

    .t-title { flex: 1; text-align: center; letter-spacing: 0.04em; }

    .t-body {
      padding: 1.25rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .cmd-line {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.6rem;
    }

    .prompt { color: var(--purple); user-select: none; }
    .cmd    { color: var(--blue); }

    .output {
      padding-left: 1.6rem;
      margin-top: 0.2rem;
      margin-bottom: 0.4rem;
    }

    .out-name {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--pink);
      text-shadow: 0 0 10px rgba(255,176,208,0.4);
      letter-spacing: 0.02em;
    }

    .out-role {
      font-size: 0.82rem;
      color: var(--dim);
      margin-top: 0.2rem;
    }

    .link-list {
      padding-left: 1.6rem;
      margin-top: 0.2rem;
      margin-bottom: 0.4rem;
      display: flex;
      flex-direction: column;
    }

    .link-item {
      display: flex;
      gap: 1rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      padding: 0.6rem 0;
      min-height: 44px;
      align-items: center;
      transition: color 0.1s, text-shadow 0.1s;
    }

    .link-item:hover { text-shadow: 0 0 8px currentColor; }

    .link-key { min-width: 5rem; flex-shrink: 0; }
    .link-item:nth-child(1) .link-key { color: var(--peach); }
    .link-item:nth-child(2) .link-key { color: var(--blue);  }
    .link-item:nth-child(3) .link-key { color: var(--mint);  }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor {
      display: inline-block;
      color: var(--purple);
      animation: blink 1s step-end infinite;
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="t-bar">
      <div class="t-dots">
        <div class="t-dot"></div>
        <div class="t-dot"></div>
        <div class="t-dot"></div>
      </div>
      <span class="t-title">yvhalo@github.io: ~</span>
    </div>

    <div class="t-body">
      <div class="cmd-line">
        <span class="prompt">$</span>
        <span class="cmd">whoami</span>
      </div>
      <div class="output">
        <p class="out-name">Yvette Hernández Alonso</p>
        <p class="out-role">Android Developer</p>
      </div>

      <div class="cmd-line">
        <span class="prompt">$</span>
        <span class="cmd">connect --list</span>
      </div>
      <div class="link-list">
        <a class="link-item" href="https://linkedin.com/in/yvhalo" target="_blank" rel="noopener noreferrer">
          <span class="link-key">[linkedin]</span>
          <span>linkedin.com/in/yvhalo</span>
        </a>
        <a class="link-item" href="https://github.com/yvhalo" target="_blank" rel="noopener noreferrer">
          <span class="link-key">[github]</span>
          <span>github.com/yvhalo</span>
        </a>
        <a class="link-item" href="projects/index.html">
          <span class="link-key">[projects]</span>
          <span>./projects/</span>
        </a>
      </div>

      <div class="cmd-line">
        <span class="prompt">$</span>
        <span class="cursor">█</span>
      </div>
    </div>
  </div>
</body>
</html>
